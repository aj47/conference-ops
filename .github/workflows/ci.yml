name: Verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    name: Application and D1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Verify generated migration is current
        run: |
          pnpm db:generate
          git diff --exit-code -- migrations
      - name: Lint, typecheck, test, and build
        run: pnpm verify
      - name: Run authenticated production-path smoke
        run: pnpm smoke:production-local
      - name: Install end-to-end browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run desktop and mobile lifecycle tests
        run: pnpm test:e2e
      - name: Apply migrations and realistic seed to an isolated D1
        run: bash scripts/verify-migrations.sh
      - name: Render staging and production deployment configurations
        env:
          MAIL_FROM: program@example.com
          MAIL_REPLY_TO: replies@example.com
        run: |
          CLOUDFLARE_D1_DATABASE_ID=11111111-1111-4111-8111-111111111111 \
            PUBLIC_APP_URL=https://staging.example.com \
            ENABLE_CLOUDFLARE_EMAIL=false \
            node scripts/render-wrangler-config.mjs --environment staging --out-dir artifacts/wrangler-staging
          node scripts/check-deploy-prerequisites.mjs staging artifacts/wrangler-staging
          CLOUDFLARE_D1_DATABASE_ID=22222222-2222-4222-8222-222222222222 \
            PUBLIC_APP_URL=https://conference.example.com \
            ENABLE_CLOUDFLARE_EMAIL=true \
            node scripts/render-wrangler-config.mjs --environment production --out-dir artifacts/wrangler-production
          node scripts/check-deploy-prerequisites.mjs production artifacts/wrangler-production
      - name: Dry-run every Worker in both environments
        run: |
          for environment in staging production; do
            install -m 600 "artifacts/wrangler-${environment}/wrangler.jsonc" wrangler.jsonc
            install -m 600 "artifacts/wrangler-${environment}/wrangler.jobs.jsonc" wrangler.jobs.jsonc
            install -m 600 "artifacts/wrangler-${environment}/wrangler.realtime.jsonc" wrangler.realtime.jsonc
            pnpm exec wrangler deploy --dry-run --env "$environment" --config wrangler.realtime.jsonc
            pnpm exec wrangler deploy --dry-run --env "$environment" --config wrangler.jobs.jsonc
            CLOUDFLARE_ENV="$environment" pnpm build
            node scripts/check-vite-deploy-config.mjs "$environment"
            CLOUDFLARE_ENV="$environment" pnpm exec wrangler deploy --dry-run
          done

  terraform:
    name: Terraform syntax and validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ci-placeholder-token
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.5
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform plan -refresh=false -lock=false -input=false -var-file=terraform.tfvars.example
      - name: Validate environment stack
        run: |
          mkdir -p "$RUNNER_TEMP/conference-ops-terraform"
          cp infra/terraform/*.tf "$RUNNER_TEMP/conference-ops-terraform/"
          cp infra/terraform/.terraform.lock.hcl "$RUNNER_TEMP/conference-ops-terraform/"
          sed -i '/backend "s3" {}/d' "$RUNNER_TEMP/conference-ops-terraform/versions.tf"
          terraform -chdir="$RUNNER_TEMP/conference-ops-terraform" init -backend=false -lockfile=readonly
          terraform -chdir="$RUNNER_TEMP/conference-ops-terraform" validate
          terraform -chdir="$RUNNER_TEMP/conference-ops-terraform" plan -refresh=false -lock=false -input=false -var-file="$GITHUB_WORKSPACE/infra/environments/ci.tfvars"
